services:
  backend:
    image: backend_image:v0.0.1
    build:
      context: ./backend
    container_name: backend_cont
    env_file:
      - ./backend/.env
    networks:
      - app-network
    ports:
      - "2305:8000"
    entrypoint: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - redis
      - minio

  redis:
    image: redis:7-alpine
    container_name: redis_cont
    command: ["redis-server", "--notify-keyspace-events", "KEA"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio_cont
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web UI Console
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:

networks:
  app-network:
    driver: bridge

