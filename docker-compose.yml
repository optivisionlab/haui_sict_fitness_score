services:

  # --------------------------------------------------------------------------
  # Frontend Application (Angular 21 + Nginx)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fitness_frontend:local
    container_name: fitness-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Backend API (FastAPI + PyMongo)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fitness_backend:local
    container_name: fitness-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: haui_fitness_score
    ports:
      - "8888:8888"
    volumes:
      - uploads_data:/backend/uploads
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # MongoDB Database
  # --------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: fitness-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: haui_fitness_score
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Redis Cache & PubSub
  # --------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: fitness-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "optivisionlab"
      - --notify-keyspace-events
      - "KEA"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "optivisionlab",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # MinIO Object Storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: fitness-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "password123"
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

# ----------------------------------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------------------------------
volumes:
  mongodb_data:
  redis_data:
  minio_data:
  uploads_data:

# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge