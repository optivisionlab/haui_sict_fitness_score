server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 800M;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File build có hash trong tên: cache lâu dài. File không tồn tại trả 404,
    # không trả index.html (nếu không trình duyệt nhận HTML thay cho JS và route lazy bị hỏng im lặng)
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html luôn phải kiểm tra lại, để sau mỗi lần build trình duyệt lấy đúng tên chunk mới
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}